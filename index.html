<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nytt vardagsrum – 3D och VR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0}
#ui{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#ui .grp{display:flex;gap:4px;background:rgba(255,255,255,.88);border-radius:10px;padding:4px;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#ui button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-size:14px;color:#2e2c29;cursor:pointer;min-height:36px}
#ui button.on{background:#3e6b5a;color:#fff}
#help{position:fixed;left:12px;bottom:64px;max-width:520px;background:rgba(255,255,255,.88);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:#2e2c29}
#vrbtn{z-index:10}
#favs{display:flex;gap:4px;flex-wrap:wrap}
#ui button.fav{display:flex;align-items:center;gap:6px;background:#f3efe8}
#ui button.fav.on{background:#3e6b5a;color:#fff}
#ui button.fav i{font-style:normal;opacity:.55;padding:0 2px}
#ui button.fav i:hover{opacity:1}
#ui button:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(46,44,41,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#uitog{position:fixed;right:12px;top:12px;z-index:20;border:0;background:rgba(46,44,41,.88);color:#fff;font-size:15px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#ui{right:96px}
body.hide #ui,body.hide #help{display:none}
@media (max-width:700px){
  body:not(.show) #ui,body:not(.show) #help{display:none}
  #ui{max-height:72vh;overflow-y:auto;pointer-events:auto;right:12px;top:58px}
  #ui .grp{flex-wrap:wrap;max-width:100%}
  #ui button{padding:7px 9px;font-size:13px}
  #help{display:none !important}
}
</style></head><body>
<div id="app"></div>
<button id="uitog" onclick="document.body.classList.toggle(matchMedia('(max-width:700px)').matches?'show':'hide')" aria-label="Visa eller dölj kontroller">☰ Val</button>
<div id="ui">
  <div class="grp favgrp"><button id="savb">☆ Spara favorit</button><button id="lnkb">🔗 Kopiera länk</button><button id="abb" title="Växla mellan de två senaste favoriterna">A/B</button><span id="favs"></span></div>
  <div class="grp"><button data-c="D" class="on">D · Halvvägg vid bänken</button><button data-c="E">E · Öppet båda sidor</button><button id="rwb">Dörrvägg 75 cm (idag)</button></div>
  <div class="grp"><button id="sky">Takfönster</button><button id="win">Höga fönster</button><button id="sty">Inredningsidéer</button><button id="scr">Screens nere</button><button id="bab">Bebisyta</button></div>
  <div class="grp"><button data-m="0" class="on">Möblering som nu</button><button data-m="1">Kortväggen 100&quot;</button><button data-m="5">Kortväggen 85&quot;</button><button data-m="4">Kortväggen 75&quot;, soffan fram</button><button data-m="2">TV på pelaren</button><button data-m="6">Helvägg, TV mot köket</button><button data-m="7">Frame på pelaren + projektor</button></div>
  <div class="grp"><button data-sf="" class="on">KIVIK 347</button><button data-sf="u">KIVIK 385 U</button><button id="tbb">Takbalkar</button><button id="fvb">Förvaring</button></div>
  <div class="grp"><button data-ew="tv" class="on">TV på kortväggen</button><button data-ew="tak">Duk i tak</button><button data-ew="ram">Ramduk 110&quot;</button><button id="apb">Akustikpaneler</button><button id="skb">Gardin för duken</button></div>
  <div class="grp"><button data-ut="" class="on">Inget tak ute</button><button data-ut="p">Parasoll</button><button data-ut="g">Pergola</button><button id="frb">Förråd</button></div>
  <div class="grp"><button data-gd="" class="on">Inga gardiner</button><button data-gd="w">Wave grå</button><button data-gd="o">Öljett antracit</button><button data-gd="l">Öljett linne</button><button data-gd="r">Rullgardiner</button><button data-gd="s">Screens ute</button><button id="gsb">Dra för</button><button id="pjb">Bioläge</button></div>
  <div class="grp"><button data-y="var">Vår</button><button data-y="sommar" class="on">Sommar</button><button data-y="host">Höst</button><button data-y="vinter">Vinter</button></div>
  <div class="grp"><button data-n="0" class="on">Dag</button><button data-n="1">Kväll</button><button id="tvb">TV på</button></div>
  <div class="grp"><button data-h="" class="on">Hue av</button><button data-h="sol">Hue Solnedgång</button><button data-h="norr">Hue Nordljus</button><button data-h="amb">Hue Ambilight-synk</button></div>
  <div class="grp"><button data-view="kok" class="on">Köket</button><button data-view="soffan">Från soffan</button><button data-view="bakom">Bakom soffan</button><button data-view="tradgard">Mot trädgården</button><button data-view="bank">Köksbänken</button><button data-view="utsida">Utsidan</button><button data-view="ute">Uteplatsen</button><button id="drb">Altandörr öppen</button></div>
</div>
<div id="toast"></div>
