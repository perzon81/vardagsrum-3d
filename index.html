<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nytt vardagsrum – 3D och VR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0}
#ui{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#ui .grp{display:flex;gap:4px;background:rgba(255,255,255,.88);border-radius:10px;padding:4px;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#ui button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-size:14px;color:#2e2c29;cursor:pointer;min-height:36px}
#ui button.on{background:#3e6b5a;color:#fff}
#help{position:fixed;left:12px;bottom:64px;max-width:520px;background:rgba(255,255,255,.88);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:#2e2c29}
#vrbtn{z-index:10}
</style></head><body>
<div id="app"></div>
<div id="ui">
  <div class="grp"><button data-c="A" class="on">A · Halvvägg</button><button data-c="B">B · Helt öppet</button><button data-c="C">C · Glasparti</button><button data-c="D">D · Pelaren kvar</button><button data-c="E">E · Pelaren fri</button></div>
  <div class="grp"><button id="sky">Takfönster</button><button id="win">Höga fönster</button><button id="sty">Inredningsidéer</button><button id="scr">Screens nere</button><button id="bab">Bebisyta</button></div>
  <div class="grp"><button data-m="0" class="on">Möblering som nu</button><button data-m="1">Stor TV på kortväggen</button><button data-m="2">TV på pelaren</button><button data-m="3">Bio mot trädgården</button></div>

  <div class="grp"><button data-n="0" class="on">Dag</button><button data-n="1">Kväll</button></div>
  <div class="grp"><button data-h="" class="on">Hue av</button><button data-h="sol">Hue Solnedgång</button><button data-h="norr">Hue Nordljus</button><button data-h="amb">Hue Ambilight-synk</button></div>
  <div class="grp"><button data-view="kok" class="on">Köket</button><button data-view="soffan">Från soffan</button><button data-view="bakom">Bakom soffan</button><button data-view="tradgard">Mot trädgården</button><button data-view="bank">Köksbänken</button><button data-view="utsida">Utsidan</button></div>
</div>
