<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nytt vardagsrum – 3D och VR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0}
#ui{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#ui .lbl{align-self:center;font:600 11px system-ui,sans-serif;color:#3E6B5A;padding:0 6px 0 4px;white-space:nowrap}
#ui .grp{display:flex;gap:4px;background:rgba(255,255,255,.88);border-radius:10px;padding:4px;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#ui button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-size:14px;color:#2e2c29;cursor:pointer;min-height:36px}
#ui button.on{background:#3e6b5a;color:#fff}
#help{position:fixed;left:12px;bottom:64px;max-width:520px;background:rgba(255,255,255,.88);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:#2e2c29}
#vrbtn{z-index:10}
#favs{display:flex;gap:4px;flex-wrap:wrap}
#ui button.fav{display:flex;align-items:center;gap:6px;background:#f3efe8}
#ui button.fav.on{background:#3e6b5a;color:#fff}
#ui button.fav i{font-style:normal;opacity:.55;padding:0 2px}
#ui button.fav i:hover{opacity:1}
#ui button:disabled{opacity:.4}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(46,44,41,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#uitog{position:fixed;right:12px;top:12px;z-index:20;border:0;background:rgba(46,44,41,.88);color:#fff;font-size:15px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#ui{right:96px}
body.hide #ui,body.hide #help{display:none}
@media (max-width:700px){
  body:not(.show) #ui,body:not(.show) #help{display:none}
  #ui{max-height:72vh;overflow-y:auto;pointer-events:auto;right:12px;top:58px}
  #ui .grp{flex-wrap:wrap;max-width:100%}
  #ui button{padding:7px 9px;font-size:13px}
  #help{display:none !important}
}
</style></head><body>
<div id="app"></div>
<button id="uitog" onclick="document.body.classList.toggle(matchMedia('(max-width:700px)').matches?'show':'hide')" aria-label="Visa eller dölj kontroller">☰ Val</button>
<div id="ui">
  <div class="grp favgrp"><button id="savb">☆ Spara favorit</button><button id="lnkb">🔗 Kopiera länk</button><button id="abb" title="Växla mellan de två senaste favoriterna">A/B</button><span id="favs"></span></div>
  <div class="grp"><span class="lbl">1 · Rum</span><button id="tomb">Tomt rum</button><button data-c="D" class="on">D · Halvvägg</button><button data-c="E">E · Öppet båda sidor</button><button id="rwb">Dörrvägg 75 cm</button></div>
  <div class="grp"><span class="lbl">2 · Soffa</span><button data-so="kh">KIVIK hörn</button><button data-so="ku">KIVIK U 385</button><button data-so="kf">KIVIK framdragen</button><button data-so="fl">Flytande + lekyta</button><button data-so="mod">Modulsoffa</button><button id="mob">Lekläge</button><button data-so="pb">Platsbyggd</button><button data-so="nu">Som nu</button></div>
  <div class="grp"><span class="lbl">Annan planlösning</span><button data-so="pel">TV på pelaren</button><button data-so="hv">Helvägg, TV mot köket</button><button data-so="hd">Hörnsoffa + Frame + duk</button></div>
  <div class="grp"><span class="lbl">3 · Bord</span><button data-bd="" class="on">Små bord</button><button data-bd="mod">Modulbord 4×60</button><button data-bd="hoj">Höj/sänk</button><button id="lbb">Spelbord på lekytan</button></div>
  <div class="grp"><span class="lbl">4 · TV</span><button data-tvs="75">75&quot;</button><button data-tvs="85">85&quot;</button><button data-tvs="100">98–100&quot;</button><button data-ew="frame">The Frame 85&quot;</button><button data-ew="tak">Duk i tak</button><button data-ew="ram">Ramduk 110&quot;</button><button id="pjb">Bioläge</button><button id="apb">Paneler</button><button id="skb">Gardin för</button><button id="tvb">TV på</button></div>
  <div class="grp"><span class="lbl">Gardiner</span><button data-gd="" class="on">Inga</button><button data-gd="w">Wave grå</button><button data-gd="o">Öljett antracit</button><button data-gd="l">Öljett linne</button><button data-gd="r">Rullgardiner</button><button data-gd="s">Screens ute</button><button id="gsb">Dra för</button></div>
  <div class="grp"><span class="lbl">Ljus</span><button data-n="0" class="on">Dag</button><button data-n="1">Kväll</button><button data-h="" class="on">Hue av</button><button data-h="sol">Solnedgång</button><button data-h="norr">Nordljus</button><button data-h="amb">Ambilight-synk</button></div>
  <div class="grp"><span class="lbl">Övrigt</span><button id="tbb">Takbalkar</button><button id="fvb">Förvaring</button><button id="bab">Bebisyta</button><button id="sty">Inredning</button><button id="sky">Takfönster</button><button id="win">Höga fönster</button><button id="scr">Screens nere</button><button id="drb">Altandörr öppen</button></div>
  <div class="grp"><span class="lbl">Ute</span><button data-ut="" class="on">Inget tak</button><button data-ut="p">Parasoll</button><button data-ut="g">Pergola</button><button id="frb">Förråd</button><button data-y="var">Vår</button><button data-y="sommar" class="on">Sommar</button><button data-y="host">Höst</button><button data-y="vinter">Vinter</button></div>
  <div class="grp"><span class="lbl">Visa</span><button data-view="kok" class="on">Köket</button><button data-view="soffan">Från soffan</button><button data-view="bakom">Bakom soffan</button><button data-view="tradgard">Mot trädgården</button><button data-view="bank">Köksbänken</button><button data-view="utsida">Utsidan</button><button data-view="ute">Uteplatsen</button></div>
</div>
<div id="toast"></div>
<div id="help">Dra för att titta runt, scrolla eller nyp för att zooma. <b>I VR:</b> tryck <b>B</b> eller <b>Y</b> för menyn, peka med handkontrollen och tryck på avtryckaren. Vänster spak = gå, höger spak = vrid, A = nästa vy.</div>
